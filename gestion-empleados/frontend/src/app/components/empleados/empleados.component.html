<!-- Formulario de registro de empleados con estilos de Materialize -->
<div class="container">
  <div class="row">
    <div class="col s5">
      <div class="card">
        <div class="card-content">
          <!-- #empleadoForm guarda todo el formulario; al enviarlo se llama a agregarEmpleado -->
          <form #empleadoForm="ngForm" (ngSubmit)="agregarEmpleado(empleadoForm)">
            <div class="row">
              <div class="input-field col s12">
                <input type="text" name="name" [(ngModel)]="empleadoService.selectedEmpleado.name"
                  placeholder="Ingrese su nombre">
              </div>
              <div class="input-field col s12">
                <input type="text" name="position" [(ngModel)]="empleadoService.selectedEmpleado.position"
                  placeholder="Ingrese su cargo">
              </div>
              <div class="input-field col s12">
                <input type="text" name="office" [(ngModel)]="empleadoService.selectedEmpleado.office"
                  placeholder="Ingrese su lugar de trabajo">
              </div>
              <div class="input-field col s12">
                <input type="number" name="salary" [(ngModel)]="empleadoService.selectedEmpleado.salary"
                  placeholder="Ingrese su salario">
              </div>
              <div class="card-action">
                <div class="input-field col s12">
                  <!-- type="button": limpiar NO debe enviar el formulario -->
                  <button type="button" class="btn right" (click)="resetForm(empleadoForm)">Limpiar</button>
                  <button type="submit" class="btn">Guardar</button>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="col s7">
      <!-- Columna reservada (en el material queda vacía) -->
    </div>
  </div>
</div>
